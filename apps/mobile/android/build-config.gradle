// Ma3 APK Size Optimization Configuration
// This file configures build settings for smaller APK size

android {
    buildTypes {
        release {
            // Enable code shrinking with R8
            minifyEnabled true
            
            // Enable resource shrinking
            shrinkResources true
            
            // ProGuard rules file
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // ZIP alignment for better compression
            zipAlignEnabled true
        }
    }
    
    // Split APK by architecture (creates separate APKs for arm64-v8a, armeabi-v7a)
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false  // Set to true if you want one APK for all architectures
        }
    }
    
    // Reduce APK size from native libraries
    packagingOptions {
        // Don't compress native libraries (better for Play Store)
        jniLibs {
            useLegacyPackaging false
        }
        
        // Exclude unnecessary files
        exclude 'META-INF/DUMMY.SF'
        exclude 'META-INF/DUMMY.RSA'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/rxjava.properties'
        exclude 'META-INF/MANIFEST.MF'
        exclude '**/*.kotlin_metadata'
        exclude '**/*.version'
        exclude '**/kotlin/**'
        exclude '**/kotlinx/**'
    }
    
    // Reduce dex file size
    dexOptions {
        javaMaxHeapSize "4g"
    }
}

// Exclude unnecessary dependencies from build
dependencies {
    // Exclude unused Firebase modules if not needed
    // implementation(project(':expo-modules-core')) {
    //     exclude group: 'com.facebook.react', module: 'react-native'
    // }
}
