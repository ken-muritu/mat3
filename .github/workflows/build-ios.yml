name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify assets exist
        working-directory: apps/mobile
        run: |
          echo "Checking assets directory..."
          ls -la assets/
          if [ ! -f "assets/icon.png" ] || [ ! -f "assets/splash.png" ]; then
            echo "ERROR: Required assets missing."
            exit 1
          fi
          echo "All required assets found."
      
      - name: Fix Expo dependencies
        working-directory: apps/mobile
        run: |
          npx expo install --fix

      - name: Create environment file
        working-directory: apps/mobile
        run: |
          cat << EOF > .env
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID_IOS }}
          EXPO_PUBLIC_API_URL=${{ secrets.API_URL }}
          EOF

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prebuild iOS
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --clean
          echo "Prebuild completed. Checking ios directory..."
          ls -la ios/

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: |
          pod install

      - name: Build iOS App (Simulator)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace Ma3.xcworkspace \
            -scheme Ma3 \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Create Simulator App Archive
        working-directory: apps/mobile/ios
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r ../../../../Ma3-simulator-${{ github.sha }}.zip Ma3.app
          ls -la ../../../../*.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ma3-ios-simulator
          path: apps/mobile/ios/*.zip
          retention-days: 30
